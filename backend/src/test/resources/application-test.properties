# Overrides solo para la suite de tests.
# DB con nombre aleatorio por contexto: evita que un segundo @SpringBootTest
# re-ejecute data.sql sobre las mismas filas y choque contra la PK.
spring.datasource.url=jdbc:h2:mem:${random.uuid};DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
# Clave fija para poder firmar un token vencido en los tests.
app.jwt.secret=dGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdC1zZWNyZXQtdGVzdA==
