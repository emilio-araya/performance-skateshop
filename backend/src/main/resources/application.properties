spring.application.name=skateshop-backend
server.port=8080

# --- Base de datos por defecto: H2 en memoria (para que funcione de inmediato sin dependencias externas) ---
# En memoria: data.sql se re-ejecuta limpio en cada arranque y no hay PK duplicada
# al reiniciar. Los datos de demo se pierden al detener la app, que es lo esperado
# para el entorno de desarrollo/entrega.
spring.datasource.url=jdbc:h2:mem:skateshopdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Consola H2 accesible solo desde localhost en http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# --- Alternativa: MySQL / MariaDB (descomentar y configurar para producción/entrega) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/skateshopdb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=tu_password
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- Configuración JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# --- Seguridad / JWT ---
# Nunca se commitea una clave de firma. Definí JWT_SECRET (base64, mínimo 32
# bytes) como variable de entorno en producción. Sin ella, la app arranca con
# una clave efímera aleatoria: los tokens dejan de valer al reiniciar.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# --- Configuración Swagger / OpenAPI ---
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
